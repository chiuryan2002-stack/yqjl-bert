<script>
const COL={原:"var(--yuan)",前:"var(--qian)",舊:"var(--jiu)",老:"var(--lao)"};
const MODS=["原","前","舊","老"];

const mk=t=>`<span class="m ${t[0]}">${t[0]}</span>${t.slice(1)}`;

const LEVELS=[
 {name:"職場身分", short:"第一關", key:"role2",
  q:"這個名詞屬於哪一類職場身分？",
  intro:"先看「中心名詞」。同一個修飾語，接上不同類型的身分名詞，意思就不一樣。本研究參考 Stryker 與 Burke（2000）、Ashforth（2001）的身分分類，把職場身分名詞分成三類：",
  labels:[["職務角色身分","組織裡的正式職位或管理角色：主任、董事長、校長、經理"],["關係角色身分","透過工作互動建立的人際角色：同事、部屬、夥伴、上司、雇主"],["組織成員身分","只標示屬於某個組織，不指特定職位：員工、職員、成員"]],
  colors:["var(--kick)","#ee9f98","var(--grid)"],
  items:[
   {s:"新舊行事風格差異之大，也讓老員工無所適從。",t:"老員工",a:"組織成員身分",why:"「員工」只說明他屬於這間公司，沒有指出職位，也不是相對於某個人的關係，所以是組織成員身分。"},
   {s:"民國三十八年大陸淪共前夕，政校新聞系在原系主任馬星野率領下，來到台北籌備《中央日報》復刊事宜。",t:"原系主任",a:"職務角色身分",why:"「系主任」是學校裡的正式職位，帶有權責（「率領」），屬於職務角色身分。"},
   {s:"某次舊同事約了上茶樓品茗，不遠處坐了兩位打扮趨時的少婦正在閒談。",t:"舊同事",a:"關係角色身分",why:"「同事」一定是「某人的同事」，是工作中形成的人際關係，屬於關係角色身分。"},
   {s:"……或在他人之事業中，使用原僱主之營業祕密；甚或約定員工在離職後一段期限內……",t:"原僱主",a:"關係角色身分",why:"這題比較難。「僱主」看似職位，但它是相對於「員工」而成立的身分：誰僱用你，誰就是你的僱主。本研究因此把它歸為關係角色身分。"}
  ],
  tip:{title:"教學連結：先教「名詞類型」，搭配就有規律",tags:["詞彙教學","搭配"],
   pts:["給學生一組名詞卡（主任、董事長／同事、部屬／員工、成員），先分類，再請學生猜可以接哪個修飾語。",
        "語料顯示：<span class='m 原'>原</span>九成、<span class='m 前'>前</span>近八成接職務角色；<span class='m 舊'>舊</span>七成接關係角色。先掌握名詞類型，就能預測大部分的搭配。",
        "「僱主、上司」這類詞很適合拿來討論：它們是職位，還是關係？讓學生說出判斷理由，比背答案更重要。"]}
 },
 {name:"時間參照", short:"第二關", key:"time2",
  q:"這個修飾語突顯的是哪一種時間？",
  intro:"時間參照不是事件真正發生的時間，而是修飾語在語境中「讓人看到」的時間面向：",
  labels:[["過去","把身分定位在之前的某個時間點：以前是，現在不一定是"],["延續","身分從過去一路延續到現在，強調時間的累積：資深、待很久"]],
  colors:["var(--bar1)","var(--grid)"],
  items:[
   {s:"看見一位滿頭白髮的老員工，就問他：「威爾遜，你已經在這裡工作多久了呢？」",t:"老員工",a:"延續",why:"他現在還在這裡工作，「老」強調的是工作年資很長，時間一路延續到現在。"},
   {s:"數百名老同事出席了他的喪禮，出席的不只是他服務公司的高階主管，還有許多業界領袖。",t:"老同事",a:"過去",why:"同樣是「老」，這裡指的是過去一起工作過的人，共事是過去的事。「老」是本研究唯一同時有大量「過去」與「延續」用法的字。"},

const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const cf=document.createElement('canvas');cf.id='confetti';document.body.appendChild(cf);const cx=cf.getContext('2d');let parts=[],run=false;
function sizeCf(){cf.width=innerWidth*devicePixelRatio;cf.height=innerHeight*devicePixelRatio;cx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);}sizeCf();addEventListener('resize',sizeCf);
function burst(x,y,n=60){ if(RM) return; const cols=['#7db6e0','#b3a7e0','#e0a6d8','#f6a199','#c9cefe'];
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=3+Math.random()*6;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-4,r:3+Math.random()*4,c:cols[i%5],rot:Math.random()*6,vr:(Math.random()-.5)*.4,life:1});}
  if(!run){run=true;requestAnimationFrame(tick);} }
function tick(){cx.clearRect(0,0,innerWidth,innerHeight);parts=parts.filter(p=>p.life>0);
  for(const p of parts){p.vy+=.22;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;p.life-=.012;cx.save();cx.globalAlpha=Math.max(0,p.life);cx.translate(p.x,p.y);cx.rotate(p.rot);cx.fillStyle=p.c;cx.fillRect(-p.r,-p.r/2,p.r*2,p.r);cx.restore();}
  if(parts.length) requestAnimationFrame(tick); else {run=false;cx.clearRect(0,0,innerWidth,innerHeight);} }

let cur=-1, qi=0, answered=false;
const score=LEVELS.map(()=>[]);   // true/false per question
let unlocked=1;

function renderMap(){
  document.getElementById('map').innerHTML=LEVELS.map((L,i)=>{
    const done=score[i].length===L.items.length;
    const cls=done?'done':(i<unlocked?'open':'lock');
    return `<div class="lv ${cls} ${i===cur?'now':''}" data-i="${i}">${L.short}<b>${L.name}</b></div>`;}).join('');
  document.querySelectorAll('.lv').forEach(el=>el.onclick=()=>{const i=+el.dataset.i; if(i<unlocked) startLevel(i);});
}

function home(){
  cur=-1; renderMap();
  document.getElementById('stage').innerHTML=`<div class="card">
   <div data-twominds="compact" class="compact" style="margin:-4px 0 22px"></div>
   <h2 style="font-size:24px;margin-bottom:10px">闖關說明</h2>
   <p>本研究從臺灣華語文語料庫找出 2,271 句「原、前、舊、老＋職場身分名詞」，逐句依語境做人工語義標註。每一句都要回答四個問題，也就是前四關：</p>
   <ol class="steps"><li><b>職場身分</b>：名詞是職務、關係，還是組織成員？</li><li><b>時間參照</b>：突顯過去，還是延續？</li><li><b>身分鏈結</b>：關係中止，還是持續？</li><li><b>評價傾向</b>：正向、中性，還是負向？</li></ol>
   <p>第五關是<b>華語教學挑戰</b>：把四個判斷合起來，選出原文用的字，並和 BERT 的選擇比較。每關結束都有一則<b>華語教學連結</b>，說明這個標註構面可以怎麼用在課堂上。</p>
   <div class="nav" style="justify-content:flex-start"><button class="primary" id="go">開始第一關 →</button></div></div>`;
  document.getElementById('go').onclick=()=>startLevel(0);
  if(window.YQ_mount) YQ_mount();
}

function startLevel(i){
  cur=i; qi=0; score[i]=[]; renderMap();
  const L=LEVELS[i];
  document.getElementById('stage').innerHTML=`<div class="card">
    <div class="stagehead"><h2>${L.short}・${L.name}</h2><span class="prog">${L.items.length} 題</span></div>
    <p>${L.intro}</p>
    <div class="labels">${L.labels.map(([a,b])=>`<div class="lab"><b>${a}</b><span>${b}</span></div>`).join('')}</div>
    <div class="nav" style="justify-content:flex-start"><button class="primary" id="go">開始答題 →</button></div></div>`;
  document.getElementById('go').onclick=()=>showQ();
  window.scrollTo({top:document.getElementById('map').offsetTop-10,behavior:'smooth'});
}

function sentHTML(L,it){
  if(L.chars) return esc(it.s).replace('＿','<span class="blank">＿</span>');
  const k=it.s.indexOf(it.t);
  return esc(it.s.slice(0,k))+`<span class="t">${esc(it.t)}</span>`+esc(it.s.slice(k+it.t.length));
}

function showQ(){
  const L=LEVELS[cur], it=L.items[qi]; answered=false;
  const opts=L.chars?MODS:L.labels.map(x=>x[0]);
  document.getElementById('stage').innerHTML=`<div class="card">
    <div class="stagehead"><h2>${L.short}・${L.name}</h2><span class="prog">第 ${qi+1} / ${L.items.length} 題</span></div>
    <div class="dots">${L.items.map((_,j)=>`<i class="${j<score[cur].length?(score[cur][j]?'ok':'bad'):(j===qi?'cur':'')}"></i>`).join('')}</div>
    <p style="color:var(--muted);font-size:15px;margin-bottom:4px">${L.q}</p>
    <div class="sent">${sentHTML(L,it)}</div>
    <div class="src">COCT 2019 真實語料</div>
    <div class="opts ${L.chars?'chars':''}">${opts.map(o=>`<button data-o="${o}" ${L.chars?`style="color:${COL[o]}"`:''}>${o}</button>`).join('')}</div>
    <div class="fb" id="fb"></div>
    <div class="nav"><button class="primary hidden" id="next">${qi+1<L.items.length?'下一題 →':'看本關結果 →'}</button></div></div>`;
  document.querySelectorAll('.opts button').forEach(b=>b.onclick=()=>answer(b.dataset.o));
  document.getElementById('next').onclick=()=>{ qi++; if(qi<L.items.length) showQ(); else levelEnd(); };
}

function answer(o){
  if(answered) return; answered=true;
  const L=LEVELS[cur], it=L.items[qi], ok=o===it.a;
  score[cur].push(ok);
  document.querySelectorAll('.opts button').forEach(b=>{
    b.disabled=true;
    if(b.dataset.o===it.a){b.classList.add('right');b.style.color='#fff'; if(ok){const r=b.getBoundingClientRect(); burst(r.left+r.width/2,r.top+r.height/2,40);} }
    else if(b.dataset.o===o){b.classList.add('wrong');b.style.color='#fff'}
  });
  let bert='';
  if(it.bert){
    bert=`<div class="bertbox"><h4>BERT 的選擇（完整語境，四選一機率）</h4>${MODS.map((m,j)=>`<div class="pbar"><span class="m ${m}">${m}</span><div class="tr"><div style="background:${COL[m]}" data-w="${it.bert[j]/10}"></div></div><span>${(it.bert[j]/10).toFixed(1)}%</span></div>`).join('')}</div>`;
  }
  const fb=document.getElementById('fb');
  fb.innerHTML=`<div class="verdict ${ok?'ok':'bad'}">${ok?'標得好！':'再想一想：'}</div>
    <div class="ans">人工標註答案：<b>${L.chars?mk(it.t):it.a}</b>　·　目標詞：${mk(it.t)}</div>
    <p style="margin:0">${it.why}</p>${bert}`;
  fb.classList.add('show');
  if(window.YQL) YQL.activity('annotate',ok?3:1);
  if(window.SFX) ok?SFX.correct():SFX.wrong();
  requestAnimationFrame(()=>setTimeout(()=>fb.querySelectorAll('.tr div').forEach(d=>d.style.width=d.dataset.w+'%'),30));
  document.getElementById('next').classList.remove('hidden');
}

function distHTML(L){
  if(!L.key) return '';
  const names=L.labels.map(x=>x[0]);
  return `<h3 style="font-size:18px;margin:20px 0 4px">這一關在 2,271 句語料中的分布</h3>
   <div class="dist">${MODS.map(m=>{const v=DIST[L.key][m], n=v.reduce((a,b)=>a+b,0);
     return `<div class="drow"><span class="m ${m}">${m}</span><div class="dbar">${v.map((x,j)=>{const p=x/n*100;return `<div style="width:${p}%;background:${L.colors[j]};color:#fff" title="${names[j]} ${x} 句">${p>=9?p.toFixed(0)+'%':''}</div>`}).join('')}</div><span style="color:var(--muted)">${n.toLocaleString()} 句</span></div>`}).join('')}</div>
   <div class="legend">${names.map((x,j)=>`<span><i style="background:${L.colors[j]}"></i>${x}</span>`).join('')}</div>`;
}

function levelEnd(){
  const L=LEVELS[cur], s=score[cur].filter(Boolean).length;
  if(cur+1>=unlocked) unlocked=Math.min(LEVELS.length,cur+2);
  renderMap();
  const last=cur===LEVELS.length-1;
  if(s>=L.items.length-1) setTimeout(()=>burst(innerWidth/2,innerHeight*.35,110),250);
  document.getElementById('stage').innerHTML=`<div class="card">
    <div class="stagehead"><h2>${L.short}・${L.name}　完成！</h2></div>
    <div style="display:flex;align-items:baseline;gap:12px"><span class="score">${s} / ${L.items.length}</span><span style="color:var(--muted)">${s===L.items.length?'全對，標註一致！':s>=L.items.length/2?'大致掌握了這個構面。':'這個構面不容易，可以再挑戰一次。'}</span></div>
    ${distHTML(L)}
    <div class="tip"><h3>${L.tip.title}</h3><div>${L.tip.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div><ul>${L.tip.pts.map(p=>`<li>${p}</li>`).join('')}</ul></div>
    <div class="nav"><button id="again">重玩本關</button><button class="primary" id="next">${last?'看闖關總結 →':'前往'+LEVELS[cur+1].short+'：'+LEVELS[cur+1].name+' →'}</button></div></div>`;
  document.getElementById('again').onclick=()=>startLevel(cur);
  document.getElementById('next').onclick=()=>last?finale():startLevel(cur+1);
}

function finale(){
  cur=-1; renderMap();
  const tot=score.flat().filter(Boolean).length, all=LEVELS.reduce((a,L)=>a+L.items.length,0);
  const title=tot>=all-2?'資深標註員':tot>=all*0.6?'標註員':'見習標註員';

  document.getElementById('stage').innerHTML=`<div class="card">
    <div class="kicker">闖關總結</div>
    <div style="display:flex;align-items:baseline;gap:14px;flex-wrap:wrap"><span class="score">${tot} / ${all}</span><h2 style="font-size:24px">${title}</h2></div>
    <p style="margin-top:12px">${LEVELS.map((L,i)=>`${L.name} ${score[i].filter(Boolean).length}/${L.items.length}`).join('　·　')}</p>
    <h3 style="font-size:20px;margin:22px 0 6px">帶得走的近義詞辨析流程</h3>
    <ol class="steps">
      <li><b>看名詞</b>：職務角色多用 <span class="m 原">原</span>、<span class="m 前">前</span>；關係角色多用 <span class="m 舊">舊</span>、<span class="m 老">老</span>。</li>
      <li><b>看時間</b>：只是「以前是」→ <span class="m 前">前</span>、<span class="m 原">原</span>、<span class="m 舊">舊</span>；強調「很久、到現在」→ <span class="m 老">老</span>。</li>
      <li><b>看關係</b>：共事已結束但重在「曾經一起」→ <span class="m 舊">舊</span>；重在「交情久」→ <span class="m 老">老</span>。</li>
      <li><b>看語氣與語體</b>：<span class="m 老">老</span>可褒可貶；「<span class="m 原">原</span>＋職務」多見於新聞報導。</li>
    </ol>
