function sentence(r, fill){

}

    <div class="qno">結果</div><h2>${head}</h2>
    <div class="big"><div><b>${game.me}/${n}</b><span>你</span></div><div><b>${game.bert}/${n}</b><span>BERT</span></div></div>
    <p>在「舊」題（語料用舊、BERT 卻押老）上，你答對 ${trap.filter(x=>x.ok).length}/${trap.length}，BERT 答對 ${trap.filter(x=>x.bok).length}/${trap.length}。
    這些題目是特別挑出來的：探針能從 BERT 的表徵讀出語境裡的「過去／延續」，但它的選字結果多與名詞最常見的搭配一致，常把「舊同事」填成「老同事」。</p>
    <table class="log"><tr><th>句子</th><th>語料</th><th>你</th><th>BERT</th></tr>
    ${game.log.map(x=>`<tr><td>…${esc(x.r.L.slice(-14))}<b class="${x.r.m}">${x.r.m}</b>${esc(x.r.n)}</td><td class="${x.r.m}"><b>${x.r.m}</b></td><td>${x.ok?"✓":"✗ "+x.mine}</td><td>${x.bok?"✓":"✗ "+x.p}</td></tr>`).join("")}
    </table>
    <button class="btn" id="again">再玩一次</button> <a class="btn ghost" href="index.html#lab">去語境實驗室動手改句子</a>
  </div>`;
  $("#again").onclick = ()=>{ newGame(); ask(); };
}

/* ================= 主持模式（投影用） ================= */
let H;
function hostInit(){
  document.body.classList.add("host");
  H = {k:0, res:{}, counts:[0,0,0,0], revealed:false, timer:null};
  hostAsk();
}
function hostScore(){
  const v=Object.values(H.res); H.cls=v.reduce((a,x)=>a+x[0],0); H.bert=v.reduce((a,x)=>a+x[1],0);
  $("#score").innerHTML = `<span class="pill">全班 <b>${H.cls}</b></span><span>vs.</span><span class="pill">BERT <b>${H.bert}</b></span>`;
}
function hostAsk(){
  hostScore();
  H.counts=[0,0,0,0]; H.revealed=false;
  const r = POOL[HOST_SET[H.k]];
  app.innerHTML = `<div class="q">
    <div class="qno">第 ${H.k+1} / ${HOST_SET.length} 題　·　請舉手：你會填哪個字？</div>
    <div class="sent">${sentence(r)}</div>
    <div class="timer"><div id="tbar"></div></div>
    <div class="tally">${MODS.map((m,k)=>`<div class="tcard ${m}" data-k="${k}"><div class="ch">${m}</div><div class="ct"><button data-d="-1">−</button><input type="number" min="0" value="0"><button data-d="1">＋</button></div></div>`).join("")}</div>
    <div class="cmp" id="cmp"></div>
    <div><button class="btn" id="rvBtn">揭曉</button> <button class="btn ghost" id="tBtn">計時 15 秒</button></div>
    <div class="keys">鍵盤：<kbd>1</kbd>–<kbd>4</kbd> 為原／前／舊／老加一票（<kbd>Shift</kbd>＋數字減一），<kbd>T</kbd> 計時，<kbd>Space</kbd> 揭曉／下一題，<kbd>←</kbd> 上一題</div>
  </div>`;
  app.querySelectorAll(".tcard").forEach(c=>{
    const k=+c.dataset.k, inp=c.querySelector("input");
    c.querySelectorAll("button").forEach(b=>b.onclick=()=>{ H.counts[k]=Math.max(0,H.counts[k]+ +b.dataset.d); inp.value=H.counts[k]; });
    inp.oninput=()=>{ H.counts[k]=Math.max(0,+inp.value||0); };
  });
  $("#rvBtn").onclick = hostReveal;
  $("#tBtn").onclick = startTimer;
}
function startTimer(){
  clearInterval(H.timer); const t0=Date.now(), D=15000, bar=$("#tbar");
  H.timer=setInterval(()=>{ const f=Math.max(0,1-(Date.now()-t0)/D); if(bar) bar.style.width=(f*100)+"%"; if(f<=0) clearInterval(H.timer); },50);
}
function hostReveal(){
  if(H.revealed){ H.k++; H.k<HOST_SET.length ? hostAsk() : hostEnd(); return; }
  clearInterval(H.timer);
  H.revealed=true;
  const r = POOL[HOST_SET[H.k]], p = pick(r), tot = H.counts.reduce((a,b)=>a+b,0);
  const mx = Math.max(...H.counts), clsPick = tot ? MODS.filter((m,k)=>H.counts[k]===mx) : [];
  const clsOK = clsPick.length===1 && clsPick[0]===r.m;
  H.res[H.k]=[+clsOK, +(p===r.m)]; hostScore();
  if(window.SFX) clsOK?SFX.correct(true):SFX.wrong();
  app.querySelector(".sent").innerHTML = sentence(r, r.m);
  app.querySelectorAll(".tcard").forEach(c=>{ if(MODS[+c.dataset.k]===r.m) c.classList.add("gold"); });
  const cmp = $("#cmp");
  const cv = tot ? H.counts.map(c=>c/tot) : [0,0,0,0];
  cmp.innerHTML = `<div><h3>全班（${tot} 票）${clsPick.length===1 ? "：多數選「"+clsPick[0]+"」"+(clsOK?" ✓":" ✗") : tot ? "：平票" : ""}</h3>${probBars(cv, HCOL, v=>Math.round(v*100)+"%")}</div>
    <div><h3>BERT：首選「${p}」${p===r.m?" ✓":" ✗"}</h3>${probBars(r.pa.map(v=>v/1000), HCOL, v=>(v*100).toFixed(1)+"%")}</div>
    <div class="why" style="grid-column:1/-1">語料原字是 <b class="${r.m}">${r.m}</b>。${why(r)}</div>`;
  cmp.classList.add("on"); grow(cmp);
  $("#rvBtn").textContent = H.k+1<HOST_SET.length ? "下一題" : "總結";
}
function hostEnd(){
  hostScore();
  const n=HOST_SET.length;
  app.innerHTML = `<div class="hostend">
    <div class="qno">總結</div>
    <div class="vs"><div><b>${H.cls}</b><span>全班</span></div><div><b>${H.bert}</b><span>BERT</span></div></div>
    <p style="font-size:24px;max-width:860px;margin:0 auto">${n} 題中，BERT 在全部 2,271 句的準確率是 75.3%，<br>但「只看名詞」的搭配統計就有 72.0%。</p>
    <p style="font-size:24px;max-width:860px;margin:18px auto 0">那麼，BERT 到底有沒有讀懂語境？我們用探針一層一層看。</p>
    <button class="btn" onclick="location.href='index.html'">進入研究網頁</button>
  </div>`;
}
document.addEventListener("keydown", e=>{
  if(!document.body.classList.contains("host") || e.target.tagName==="INPUT") return;
  const d = {"Digit1":0,"Digit2":1,"Digit3":2,"Digit4":3}[e.code];
  if(d!==undefined && H && !H.revealed && $(".tcard")){ H.counts[d]=Math.max(0,H.counts[d]+(e.shiftKey?-1:1)); app.querySelectorAll(".tcard input")[d].value=H.counts[d]; e.preventDefault(); }
  else if(e.code==="Space"){ e.preventDefault(); if($("#rvBtn")) hostReveal(); }
  else if(e.code==="KeyT"){ if($("#tBtn")) startTimer(); }
  else if(e.code==="ArrowLeft" && H.k>0){ H.k--; hostAsk(); }
});
function route(){ if(location.hash==="#host") hostInit(); else { document.body.classList.remove("host"); intro(); } }
window.addEventListener("hashchange", route);
route();
</script>
